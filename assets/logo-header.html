<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Robyn Miller Instruments</title>
<style>
  :root { --ink: #f2efea; --paper: transparent; }   /* the inverted logo: cream lines, on the black bar */
  :root[data-ink="paper"] { --ink: #1a1a1a; --paper: transparent; }
  /* the page header copy: no paper, no tools, sized to its little frame */
  .tools { display: none !important; }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; background: var(--paper); color: var(--ink); overflow: hidden; }
  body { display: grid; place-items: center; font: 300 12px "Helvetica Neue", Arial, sans-serif;
         -webkit-font-smoothing: antialiased; transition: background .3s, color .3s; }
  #stage { position: relative; width: 50vmin; -webkit-tap-highlight-color: transparent; }
  #logo { width: 100%; height: auto; display: block; }
  #solids { position: absolute; pointer-events: none; }
  .tools { position: fixed; right: 16px; bottom: 14px; display: flex; gap: 14px;
           letter-spacing: .14em; text-transform: uppercase; }
  .tools button { all: unset; cursor: pointer; opacity: .45; transition: opacity .2s; }
  .tools button:hover { opacity: 1; }
</style>
</head>
<body>

<div id="stage">
  <svg id="logo" viewBox="0 0 1000 960" role="img" aria-label="Robyn Miller Instruments"></svg>
  <canvas id="solids"></canvas>
</div>

<div class="tools">
  <button id="swap">invert</button>
  <button id="save">save svg</button>
</div>

<script>
(() => {
  // ---------------------------------------------------------------- geometry
  const CX = 500, CY = 370;
  const R_IN = 340;             // the circle
  const R_SUN = 212;            // the sun, centred on the horizon
  const ROAD = 40;              // road edges, degrees either side of straight down
  const LINE = 5;               // one weight for every drawn line in the mark
  const COL = { sky: '#2f6fb6', sun: '#f4c22b', ground: '#3a9a4b', road: '#8d8d8d' };

  const TITLE_W = 2 * R_IN;
  const CAP1 = 56, CAP2 = 34;   // ROBYN MILLER, INSTRUMENTS
  const PEN = 2.6;              // the lettering's pen: hairline, like the buttons
  const GAP = 70;               // circle to first line
  const LEAD = 34;              // between the lines

  const NS = 'http://www.w3.org/2000/svg';
  const svg = document.getElementById('logo');
  const el = (tag, attrs, parent = svg) => {
    const e = document.createElementNS(NS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    parent.appendChild(e);
    return e;
  };
  const f = n => +n.toFixed(2);
  const rad = d => d * Math.PI / 180;

  // ---------------------------------------------------------------- letters
  // Hairline geometric capitals: straight strokes and true circle arcs on a unit
  // cap height (x right, y up from the baseline). Each glyph: [width, strokes];
  // ops: ['M',x,y] ['L',x,y] ['A',cx,cy,r,a0,a1] (degrees, anticlockwise positive).
  const G = {
    I: [0, [[['M',0,0],['L',0,1]]]],
    L: [0.5, [[['M',0,1],['L',0,0],['L',0.5,0]]]],
    E: [0.5, [[['M',0.5,1],['L',0,1],['L',0,0],['L',0.5,0]], [['M',0,0.5],['L',0.44,0.5]]]],
    T: [0.62, [[['M',0,1],['L',0.62,1]], [['M',0.31,1],['L',0.31,0]]]],
    N: [0.68, [[['M',0,0],['L',0,1],['L',0.68,0],['L',0.68,1]]]],
    M: [0.86, [[['M',0,0],['L',0,1],['L',0.43,0.1],['L',0.86,1],['L',0.86,0]]]],
    Y: [0.66, [[['M',0,1],['L',0.33,0.5],['L',0.66,1]], [['M',0.33,0.5],['L',0.33,0]]]],
    O: [1, [[['A',0.5,0.5,0.5,90,450]]]],
    U: [0.64, [[['M',0,1],['L',0,0.32],['A',0.32,0.32,0.32,180,360],['L',0.64,1]]]],
    R: [0.58, [[['M',0,0],['L',0,1],['L',0.31,1],['A',0.31,0.75,0.25,90,-90],['L',0,0.5]],
               [['M',0.31,0.5],['L',0.58,0]]]],
    B: [0.58, [[['M',0,0],['L',0,1],['L',0.31,1],['A',0.31,0.75,0.25,90,-90],['L',0,0.5]],
               [['M',0.31,0.5],['A',0.31,0.25,0.25,90,-90],['L',0,0]]]],
    S: [0.52, [[['A',0.26,0.75,0.25,20,270],['A',0.26,0.25,0.25,90,-160]]]],
  };

  // one glyph → SVG path data at (ox, baseline) and cap height s; arcs stay true arcs
  function glyphPath(ch, ox, base, s) {
    const X = x => f(ox + x * s), Y = y => f(base - y * s);
    let d = '';
    for (const stroke of G[ch][1]) {
      let pen = null;
      for (const op of stroke) {
        if (op[0] === 'M') { d += `M${X(op[1])} ${Y(op[2])}`; pen = [op[1], op[2]]; }
        else if (op[0] === 'L') { d += `L${X(op[1])} ${Y(op[2])}`; pen = [op[1], op[2]]; }
        else {
          const [, cx, cy, r, a0, a1] = op;
          const sx = cx + r * Math.cos(rad(a0)), sy = cy + r * Math.sin(rad(a0));
          d += pen ? `L${X(sx)} ${Y(sy)}` : `M${X(sx)} ${Y(sy)}`;
          const n = Math.ceil(Math.abs(a1 - a0) / 90);
          for (let i = 1; i <= n; i++) {
            const a = rad(a0 + (a1 - a0) * i / n);
            const ex = cx + r * Math.cos(a), ey = cy + r * Math.sin(a);
            // anticlockwise in glyph space is anticlockwise on screen too once y flips → sweep 0
            d += `A${f(r * s)} ${f(r * s)} 0 0 ${a1 > a0 ? 0 : 1} ${X(ex)} ${Y(ey)}`;
          }
          pen = [cx + r * Math.cos(rad(a1)), cy + r * Math.sin(rad(a1))];
        }
      }
    }
    return d;
  }

  // a line of capitals spread to exactly `width`, centred on CX; a word space = 2 letter spaces
  function titleLine(text, base, cap, width) {
    const words = text.split(' ');
    let ink = 0, gaps = 0;
    words.forEach((w, wi) => {
      for (const ch of w) ink += G[ch][0] * cap;
      gaps += w.length - 1 + (wi ? 2 : 0);
    });
    const track = (width - ink) / gaps;
    let x = CX - width / 2, d = '';
    words.forEach((w, wi) => {
      if (wi) x += 2 * track;
      for (const ch of w) { d += glyphPath(ch, x, base, cap); x += G[ch][0] * cap + track; }
    });
    return d;
  }


  // ---------------------------------------------------------------- the mark (at rest)
  const defs = el('defs', {});
  const disc = el('clipPath', { id: 'disc' }, defs);
  el('circle', { cx: CX, cy: CY, r: R_IN }, disc);

  const flat = el('g', {});
  const mark = el('g', { 'clip-path': 'url(#disc)' }, flat);
  el('rect', { x: CX - R_IN, y: CY - R_IN, width: 2 * R_IN, height: 2 * R_IN, fill: COL.sky }, mark);
  el('circle', { cx: CX, cy: CY, r: R_SUN, fill: COL.sun, stroke: 'var(--ink)', 'stroke-width': LINE }, mark);
  el('rect', { x: CX - R_IN, y: CY, width: 2 * R_IN, height: R_IN, fill: COL.ground }, mark);
  const rx = 2 * R_IN * Math.sin(rad(ROAD)), ry = 2 * R_IN * Math.cos(rad(ROAD));   // runs past the rim; the circle clips it
  const road = `M ${f(CX - rx)} ${f(CY + ry)} L ${CX} ${CY} L ${f(CX + rx)} ${f(CY + ry)}`;
  el('path', { d: road + ' Z', fill: COL.road }, mark);
  el('path', { d: road, fill: 'none', stroke: 'var(--ink)', 'stroke-width': LINE,
               'stroke-linejoin': 'miter', 'stroke-miterlimit': 10 }, mark);
  el('path', { d: `M ${CX - R_IN} ${CY} L ${CX + R_IN} ${CY}`, stroke: 'var(--ink)', 'stroke-width': LINE }, mark);
  el('circle', { cx: CX, cy: CY, r: R_IN, fill: 'none', stroke: 'var(--ink)', 'stroke-width': LINE }, flat);

  // ---------------------------------------------------------------- the name
  const base1 = CY + R_IN + GAP + CAP1;
  const base2 = base1 + LEAD + CAP2;
  el('path', { d: titleLine('ROBYN MILLER', base1, CAP1, TITLE_W) + titleLine('INSTRUMENTS', base2, CAP2, TITLE_W),
               fill: 'none', stroke: 'var(--ink)', 'stroke-width': PEN,
               'stroke-linecap': 'butt', 'stroke-linejoin': 'round' });

  // ---------------------------------------------------------------- hover: the pieces come apart
  // Every flat piece is a solid squashed to no depth: the sky is a drum seen end-on, the road a
  // pyramid edge-on, the ground the front face of a box, the sun a sphere. Hovered, they thicken
  // into solids, fall back into space and circle one another, tumbling. Left, they come home.
  const stage = document.getElementById('stage');
  const cv = document.getElementById('solids');
  const ctx = cv.getContext('2d');
  const VB_W = 1000, VB_H = 960, PAD_X = 0.45, PAD_Y = 0.3;   // the canvas reaches past the logo

  const D = 1500;                         // camera distance in front of the logo
  const BASE = R_IN + 24;                 // flat pieces run past the rim, so the circle trims them exactly
  const TAN = Math.tan(rad(ROAD));
  const S = R_IN;                         // the cube's side
  const DRUM = R_IN;                      // the drum's height: half its width
  const LIGHT = norm([-0.45, -0.75, -0.55]);

  function add(a, b) { return [a[0] + b[0], a[1] + b[1], a[2] + b[2]]; }
  function sub(a, b) { return [a[0] - b[0], a[1] - b[1], a[2] - b[2]]; }
  function dot(a, b) { return a[0] * b[0] + a[1] * b[1] + a[2] * b[2]; }
  function norm(a) { const l = Math.hypot(a[0], a[1], a[2]) || 1; return [a[0] / l, a[1] / l, a[2] / l]; }
  const lerp = (a, b, t) => a + (b - a) * t;
  const lerp3 = (a, b, t) => [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)];
  const smooth = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };

  // quaternions [w, x, y, z]
  const qAxis = (ax, ang) => { const s = Math.sin(ang / 2); return [Math.cos(ang / 2), ax[0] * s, ax[1] * s, ax[2] * s]; };
  function qRot(q, p) {
    const [w, x, y, z] = q;
    const tx = 2 * (y * p[2] - z * p[1]), ty = 2 * (z * p[0] - x * p[2]), tz = 2 * (x * p[1] - y * p[0]);
    return [p[0] + w * tx + (y * tz - z * ty), p[1] + w * ty + (z * tx - x * tz), p[2] + w * tz + (x * ty - y * tx)];
  }
  function qPart(q, t) {                  // the shortest turn from rest toward q, a fraction t of the way
    let [w, x, y, z] = q;
    if (w < 0) { w = -w; x = -x; y = -y; z = -z; }
    const ang = 2 * Math.acos(Math.min(1, w)), s = Math.sqrt(Math.max(0, 1 - w * w));
    if (s < 1e-6) return [1, 0, 0, 0];
    return qAxis([x / s, y / s, z / s], ang * t);
  }

  function newell(vs, idx) {
    let n = [0, 0, 0];
    for (let i = 0; i < idx.length; i++) {
      const a = vs[idx[i]], b = vs[idx[(i + 1) % idx.length]];
      n[0] += (a[1] - b[1]) * (a[2] + b[2]); n[1] += (a[2] - b[2]) * (a[0] + b[0]); n[2] += (a[0] - b[0]) * (a[1] + b[1]);
    }
    return n;
  }
  // wind every face outward, judged on the full solid, so the winding still holds when flattened
  function orient(vs, faces) {
    return faces.map(fc => {
      const c = fc.reduce((s, i) => add(s, vs[i]), [0, 0, 0]);
      return dot(newell(vs, fc), c) < 0 ? fc.slice().reverse() : fc;
    });
  }

  const cubeVerts = (hx, hy, hz) => [0, 1, 2, 3, 4, 5, 6, 7].map(i => [i & 1 ? hx : -hx, i & 2 ? hy : -hy, i & 4 ? hz : -hz]);
  const CUBE_F = orient(cubeVerts(1, 1, 1),
    [[0, 1, 3, 2], [4, 6, 7, 5], [0, 2, 6, 4], [1, 5, 7, 3], [0, 4, 5, 1], [2, 3, 7, 6]]);
  const pyrVerts = (hy, bw, bz) => [[0, -hy, 0], [-bw, hy, -bz], [bw, hy, -bz], [bw, hy, bz], [-bw, hy, bz]];
  const PYR_F = orient(pyrVerts(1, 1, 1), [[0, 1, 2], [0, 2, 3], [0, 3, 4], [0, 4, 1], [1, 4, 3, 2]]);
  const RING_N = 72;
  const drumVerts = hz => {
    const v = [];
    for (const z of [-hz, hz]) for (let i = 0; i < RING_N; i++) {
      const a = i / RING_N * 2 * Math.PI; v.push([R_IN * Math.cos(a), R_IN * Math.sin(a), z]);
    }
    return v;
  };
  const DRUM_SIDES = orient(drumVerts(1), [...Array(RING_N).keys()].map(i => [i, (i + 1) % RING_N, RING_N + (i + 1) % RING_N, RING_N + i]));
  const [DRUM_FRONT, DRUM_BACK] = orient(drumVerts(1), [[...Array(RING_N).keys()], [...Array(RING_N).keys()].map(i => RING_N + i)]);

  // free flight: one ring, tipped toward us, that the pieces ride around one another
  const CENTRE = [0, 10, 700], RING = 330, TILT = 0.38, SPIN = 0.3;
  const PIECES = {
    sky:     { layer: 0, phase:  Math.PI / 2, scale: 0.5,  axis: norm([1, 0.4, 0.2]),  a0: 1.1, w: 0.33 },
    sun:     { layer: 1, phase:  Math.PI,     scale: 0.76, axis: norm([0, 1, 0]),      a0: 0,   w: 0 },
    ground:  { layer: 2, phase:  0,           scale: 0.76, axis: norm([1, 1.2, 0.4]),  a0: 0.8, w: 0.55 },
    road:    { layer: 3, phase: -Math.PI / 2, scale: 0.76, axis: norm([0.6, 1, 0.2]),  a0: 0.7, w: 0.42 },
  };
  const REST = { sky: [0, 0, 0], sun: [0, 0, 0], ground: [0, BASE / 2, 0], road: [0, BASE / 2, 0] };

  function placement(name, t, e) {
    const p = PIECES[name];
    const a = p.phase + SPIN * t;
    const free = add(CENTRE, [RING * Math.cos(a),
                              RING * Math.sin(a) * Math.sin(TILT) + 18 * Math.sin(1.1 * t + 1.7 * p.phase),
                              RING * Math.sin(a) * Math.cos(TILT)]);
    return { pos: lerp3(REST[name], free, e), q: qPart(qAxis(p.axis, p.a0 + p.w * t), e), sc: lerp(1, p.scale, e) };
  }

  const proj = p => { const k = D / (D + p[2]); return [CX + p[0] * k, CY + p[1] * k]; };
  const toWorld = (pl, local) => add(pl.pos, qRot(pl.q, [local[0] * pl.sc, local[1] * pl.sc, local[2] * pl.sc]));
  function tint(hex, b) {
    const n = parseInt(hex.slice(1), 16);
    const c = [n >> 16, (n >> 8) & 255, n & 255].map(v => Math.round(Math.min(255, v * b)));
    return `rgb(${c[0]},${c[1]},${c[2]})`;
  }
  const lit = (n, m) => lerp(1, 0.55 + 0.7 * Math.max(0, dot(norm(n), LIGHT)), m);

  // ---------------------------------------------------------------- the ripple when struck
  // A struck shape's surface ripples like a vibrating string: a wave that runs over it, faster
  // for higher notes, dying away with the note. Displacement depends only on the point, so
  // neighbouring faces ripple together and never crack apart.
  const struck = {};                        // name → { at, midi }
  const RIPPLE_A = 11, RIPPLE_LEN = 2.4;    // local units; seconds until still
  function rippleFor(name, now) {
    const s = struck[name];
    if (!s) return null;
    const tau = (now - s.at) / 1000;
    if (tau > RIPPLE_LEN) { delete struck[name]; return null; }
    const amp = RIPPLE_A * Math.exp(-tau / 0.5) * (1 - Math.exp(-tau / 0.012));
    const hz = 440 * Math.pow(2, (s.midi - 69) / 12);
    const ph = 2 * Math.PI * (hz / 55) * tau;              // C4 ripples ~4.8 times a second, C5 ~9.5
    const k = 2 * Math.PI / (name === 'sky' ? 230 : 150);
    return { amp, ph, k };
  }
  function rippled(p, r) {
    if (!r) return p;
    const d = r.amp * (Math.sin(r.k * (0.8 * p[0] + 0.5 * p[1] + 0.3 * p[2]) - r.ph)
                     + 0.4 * Math.sin(1.7 * r.k * (-0.3 * p[0] + 0.85 * p[1] - 0.4 * p[2]) + 1.3 * r.ph));
    const n = norm(p);
    return [p[0] + n[0] * d, p[1] + n[1] * d, p[2] + n[2] * d];
  }
  // a run of local points between two corners, finely cut when rippling so the ripple shows
  function edgeRun(a, b, r, out) {
    const n = r ? Math.max(1, Math.ceil(Math.hypot(b[0] - a[0], b[1] - a[1], b[2] - a[2]) / 9)) : 1;
    for (let s = 0; s < n; s++) out.push(rippled(lerp3(a, b, s / n), r));
    return out;
  }
  const outlineOf = (local, fc, r) => {
    const out = [];
    fc.forEach((i, j) => edgeRun(local[i], local[fc[(j + 1) % fc.length]], r, out));
    return out;
  };

  // ---------------------------------------------------------------- drawing
  let ink = '#f2efea';
  let hits = [];                            // this frame's clickable outlines, back to front
  const cam = [0, 0, -D];
  const faceShows = (ws, fc) => {
    const n = newell(ws, fc);
    return Math.hypot(n[0], n[1], n[2]) > 1e-3 && dot(n, sub(ws[fc[0]], cam)) < 0 ? n : null;
  };
  function tracePts(pl, pts) {
    ctx.beginPath();
    const scr = pts.map(p => proj(toWorld(pl, p)));
    scr.forEach((s, j) => j ? ctx.lineTo(s[0], s[1]) : ctx.moveTo(s[0], s[1]));
    return scr;
  }
  function solid(name, pl, local, faces, colour, m, lw, r) {
    const ws = local.map(v => toWorld(pl, v));
    const polys = [];
    for (const fc of faces) {
      const n = faceShows(ws, fc);
      if (!n) continue;
      polys.push(tracePts(pl, outlineOf(local, fc, r)));
      ctx.closePath();
      ctx.fillStyle = tint(colour, lit(n, m));
      ctx.fill();
      ctx.lineWidth = lw; ctx.stroke();
    }
    hits.push({ name, polys });
  }

  const draws = {
    sky(pl, m, lw, r) {
      // the drum: sides first (no seams), then the cap that faces us, then its silhouette
      const local = drumVerts(lerp(0, DRUM / 2, m));
      const ws = local.map(v => toWorld(pl, v));
      const polys = [];
      const vis = DRUM_SIDES.map(fc => faceShows(ws, fc));
      DRUM_SIDES.forEach((fc, i) => {
        if (!vis[i]) return;
        polys.push(tracePts(pl, outlineOf(local, fc, r)));
        ctx.closePath();
        ctx.fillStyle = ctx.strokeStyle = tint(COL.sky, lit(vis[i], m));
        ctx.lineWidth = 1.2; ctx.fill(); ctx.stroke();
      });
      ctx.strokeStyle = ink;
      const caps = [DRUM_FRONT, DRUM_BACK].map(fc => [fc, faceShows(ws, fc)]);
      for (const [fc, n] of caps) {
        if (!n) continue;
        polys.push(tracePts(pl, outlineOf(local, fc, r)));
        ctx.closePath();
        ctx.fillStyle = tint(COL.sky, lit(n, m));
        ctx.fill(); ctx.lineWidth = lw; ctx.stroke();
      }
      // silhouette: where a seen side meets an unseen side, and the rim of whichever cap is hidden
      ctx.lineWidth = lw; ctx.beginPath();
      const line = pts => pts.map(p => proj(toWorld(pl, p))).forEach((s, j) => j ? ctx.lineTo(s[0], s[1]) : ctx.moveTo(s[0], s[1]));
      for (let i = 0; i < RING_N; i++) {
        const j = (i + 1) % RING_N;
        if (vis[i] && !vis[j]) line(edgeRun(local[j], local[RING_N + j], r, []).concat([rippled(local[RING_N + j], r)]));
        if (!vis[i] && vis[j]) line(edgeRun(local[j], local[RING_N + j], r, []).concat([rippled(local[RING_N + j], r)]));
        if (vis[i]) {
          if (!caps[0][1]) line(edgeRun(local[i], local[j], r, []).concat([rippled(local[j], r)]));
          if (!caps[1][1]) line(edgeRun(local[RING_N + i], local[RING_N + j], r, []).concat([rippled(local[RING_N + j], r)]));
        }
      }
      ctx.stroke();
      hits.push({ name: 'sky', polys });
    },
    sun(pl, m, lw, r) {
      const c = proj(pl.pos), rad0 = R_SUN * pl.sc * D / (D + pl.pos[2]);
      ctx.beginPath();
      const poly = [];
      for (let i = 0; i <= 120; i++) {
        const a = i / 120 * 2 * Math.PI;
        const bump = r ? r.amp * pl.sc * (Math.sin(5 * a - r.ph) + 0.4 * Math.sin(9 * a + 1.3 * r.ph)) * 0.8 : 0;
        const p = [c[0] + (rad0 + bump) * Math.cos(a), c[1] + (rad0 + bump) * Math.sin(a)];
        poly.push(p); i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1]);
      }
      ctx.closePath();
      ctx.fillStyle = COL.sun; ctx.fill();
      if (m > 0) {
        const g = ctx.createRadialGradient(c[0] - 0.38 * rad0, c[1] - 0.42 * rad0, 0.05 * rad0, c[0], c[1], rad0);
        g.addColorStop(0, 'rgba(255,250,225,0.85)');
        g.addColorStop(0.35, 'rgba(255,235,150,0.15)');
        g.addColorStop(0.75, 'rgba(150,90,0,0.18)');
        g.addColorStop(1, 'rgba(110,60,0,0.55)');
        ctx.globalAlpha = m; ctx.fillStyle = g; ctx.fill(); ctx.globalAlpha = 1;
      }
      ctx.lineWidth = lw; ctx.stroke();
      hits.push({ name: 'sun', polys: [poly] });
    },
    ground(pl, m, lw, r) {
      solid('ground', pl, cubeVerts(lerp(BASE, S / 2, m), lerp(BASE / 2, S / 2, m), lerp(0, S / 2, m)), CUBE_F, COL.ground, m, lw, r);
    },
    road(pl, m, lw, r) {
      const bw = lerp(BASE * TAN, 0.62 * BASE, m);
      solid('road', pl, pyrVerts(BASE / 2, bw, lerp(0, bw, m)), PYR_F, COL.road, m, lw, r);
    },
  };

  // canvas sits over the logo, larger than it, in the logo's own units
  let k = 1, dpr = 1;
  function fit() {
    const r = stage.getBoundingClientRect();
    dpr = window.devicePixelRatio || 1; k = r.width / VB_W;
    const w = r.width * (1 + 2 * PAD_X), h = r.width * VB_H / VB_W * (1 + 2 * PAD_Y);
    Object.assign(cv.style, { left: -r.width * PAD_X + 'px', top: -r.width * VB_H / VB_W * PAD_Y + 'px',
                              width: w + 'px', height: h + 'px' });
    cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
  }
  fit();
  addEventListener('resize', () => { fit(); paint(performance.now()); });

  let p = 0, target = 0, t = 0, last = 0, running = false;
  const ease = x => x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;

  function paint(now) {
    const e = ease(p);
    hits = [];
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, cv.width, cv.height);
    flat.style.visibility = e > 0 ? 'hidden' : 'visible';
    if (e <= 0) return;
    ctx.setTransform(dpr * k, 0, 0, dpr * k, dpr * k * VB_W * PAD_X, dpr * k * VB_H * PAD_Y);
    ctx.lineJoin = 'round';

    const m = smooth(0, 0.45, e);                 // flat → solid
    const w = smooth(0.12, 0.6, e);                // stacking order → true depth order
    const items = Object.keys(PIECES).map(name => {
      const pl = placement(name, t, e);
      return { name, pl, key: (1 - w) * PIECES[name].layer * 1000 - w * pl.pos[2] };
    }).sort((a, b) => a.key - b.key);

    ctx.save();
    ctx.beginPath(); ctx.arc(CX, CY, R_IN + 3000 * e * e, 0, 2 * Math.PI); ctx.clip();
    for (const it of items) {
      ctx.strokeStyle = ink;
      draws[it.name](it.pl, m, LINE * D / (D + it.pl.pos[2]), rippleFor(it.name, now));
    }
    ctx.restore();
  }

  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    p = target ? Math.min(1, p + dt / 1.6) : Math.max(0, p - dt / 1.15);
    if (p > 0) t += dt; else t = 0;
    paint(now);
    if (target || p > 0 || Object.keys(struck).length) requestAnimationFrame(frame); else running = false;
  }
  const kick = () => { if (!running) { running = true; last = performance.now(); requestAnimationFrame(frame); } };

  let order = new Map();
  let ac = null, bus = null, bufs = {};

  function hall(ctx, secs) {                 // a dark hall: early taps, then a decaying, darkening tail
    const sr = ctx.sampleRate, len = Math.floor(sr * secs), ir = ctx.createBuffer(2, len, sr);
    for (let ch = 0; ch < 2; ch++) {
      const d = ir.getChannelData(ch);
      let lp = 0, seed = 1234 + ch * 777;
      const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647) * 2 - 1;
      for (let i = 0; i < len; i++) {
        const tt = i / sr;
        const c = lerp(0.85, 0.12, Math.min(1, tt / secs));          // the tail loses its top first
        lp += c * (rnd() - lp);
        d[i] = tt < 0.018 ? 0 : lp * Math.exp(-6.9 * tt / secs) * 0.9;
      }
      [0.011, 0.019, 0.027, 0.041].forEach((tap, j) => { d[Math.floor((tap + ch * 0.003) * sr)] += 0.5 / (j + 1); });
    }
    return ir;
  }
  function audio() {
    if (ac) return;
    ac = new (window.AudioContext || window.webkitAudioContext)();
    const limit = ac.createDynamicsCompressor();
    limit.threshold.value = -8; limit.ratio.value = 12; limit.attack.value = 0.002; limit.release.value = 0.2;
    bus = ac.createGain(); bus.gain.value = 0.9;
    const dry = ac.createGain(); dry.gain.value = 0.82;
    const verb = ac.createConvolver(); verb.buffer = hall(ac, 2.8);
    const wet = ac.createGain(); wet.gain.value = 0.42;
    bus.connect(dry).connect(limit);
    bus.connect(verb).connect(wet).connect(limit);
    limit.connect(ac.destination);
    for (const n of NOTES) {
      const bin = Uint8Array.from(atob(AUDIO[n]), c => c.charCodeAt(0));
      bufs[n] = ac.decodeAudioData(bin.buffer);
    }
  }
  function strike(name) {
    if (!order.has(name)) {
      if (order.size >= NOTES.length) return;
      order.set(name, NOTES[order.size]);
    }
    const midi = order.get(name);
    audio();
    if (ac.state === 'suspended') ac.resume();
    bufs[midi].then(b => {
      const src = ac.createBufferSource();
      src.buffer = b; src.connect(bus); src.start();
    }).catch(() => {});
    struck[name] = { at: performance.now(), midi };
    kick();
  }

  // ---------------------------------------------------------------- pointer
  function shapeAt(ev) {
    const r = stage.getBoundingClientRect();
    const x = (ev.clientX - r.left) / k, y = (ev.clientY - r.top) / k;
    const inside = poly => {
      let c = false;
      for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
        const [xi, yi] = poly[i], [xj, yj] = poly[j];
        if ((yi > y) !== (yj > y) && x < (xj - xi) * (y - yi) / (yj - yi) + xi) c = !c;
      }
      return c;
    };
    for (let i = hits.length - 1; i >= 0; i--) if (hits[i].polys.some(inside)) return hits[i].name;
    return null;
  }
  const open = () => { if (!target) { target = 1; kick(); } };
  const close = () => { if (target) { target = 0; order = new Map(); kick(); } };

  stage.addEventListener('pointerenter', e => { if (e.pointerType === 'mouse') open(); });
  stage.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse') { close(); stage.style.cursor = ''; } });
  stage.addEventListener('pointermove', e => {
    if (e.pointerType === 'mouse') stage.style.cursor = p > 0.6 && shapeAt(e) ? 'pointer' : '';
  });
  stage.addEventListener('pointerup', e => {
    const hit = p > 0.6 ? shapeAt(e) : null;
    if (hit) strike(hit);
    else if (e.pointerType !== 'mouse') target ? close() : open();   // touch: tap opens, tap away closes
  });

  // ---------------------------------------------------------------- tools
  const readInk = () => getComputedStyle(document.documentElement).getPropertyValue('--ink').trim();
  ink = readInk();
  document.getElementById('swap').onclick = () => {
    const root = document.documentElement;
    root.dataset.ink = root.dataset.ink === 'paper' ? '' : 'paper';
    ink = readInk(); paint(performance.now());
  };
  document.getElementById('save').onclick = () => {
    const src = new XMLSerializer().serializeToString(svg).replaceAll('var(--ink)', readInk());
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([src], { type: 'image/svg+xml' }));
    a.download = 'robyn-miller-instruments.svg';
    a.click();
  };
})();
