<style>
  /* Robyn Miller Instruments page only: no sidebar or menu; the page fills the window and scrolls itself */
  html, body { background: #000 !important; }
  /* the Squarespace page itself never scrolls: on a phone every swipe belongs to the instruments page in front */
  html, body { overflow: hidden !important; height: 100% !important; overscroll-behavior: none !important; }
  body { position: fixed !important; top: 0; right: 0; bottom: 0; left: 0; }
  #headerWrapper, #mobileNav, #topNavMobile, #mobileMenuLink { display: none !important; }
  #page .sqs-block-code { transform: none !important; }
  #page .sqs-code-container { position: fixed; top: 0; right: 0; bottom: 0; left: 0; z-index: 5; background: #f0f0ee; }
  .rmi-frame { display: block; width: 100%; height: 100%; border: 0; }

  /* the Contact and Stay tuned windows: the About Us window's look, with the site's own forms inside */
  .rmi-veil { position: fixed; top: 0; right: 0; bottom: 0; left: 0; z-index: 60; display: none; }
  .rmi-veil.open { display: block; }
  /* closed, a window is gone altogether (display: none), so nothing invisible sits over the page to catch a swipe */
  .rmi-window { position: fixed; z-index: 61; left: 16px; top: 160px; width: min(440px, calc(100vw - 32px)); padding: 30px 34px 32px;
                box-sizing: border-box; display: none; flex-direction: column; justify-content: center;
                background: rgba(250, 250, 248, .84); -webkit-backdrop-filter: blur(18px) saturate(1.2); backdrop-filter: blur(18px) saturate(1.2);
                border-radius: 18px; box-shadow: 0 0 70px rgba(0, 0, 0, .24);
                opacity: 0; transform: translateY(-6px); pointer-events: none; transition: opacity .2s, transform .2s; }
  .rmi-window.open { opacity: 1; transform: none; pointer-events: auto; }
  .rmi-window iframe { display: block; width: 100%; height: 300px; border: 0; background: transparent; color-scheme: light; }
  @media (min-width: 1100px) and (min-height: 600px) {
    .rmi-window { --side: min(max(33.333vw, 460px), calc(100vh - 48px));
                  left: 50%; top: 50%; width: var(--side); min-height: var(--side); padding: 1in; transform: translate(-50%, -48%); }
    .rmi-window.open { transform: translate(-50%, -50%); }
  }
</style>
<script>
/* CONTACT and "Stay tuned!" on the instruments page ask this page to open their windows. Each form is a page of
   this site, loaded here and stripped to its form: being on this site, it can send. How the forms look is in
   forms.css on the instruments page's site, so it can change without a new paste. */
(function () {
  var PAGE = 'https://tinselman.github.io', STYLE = PAGE + '/instruments/embed/forms.css';
  var FONT = 'https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400&display=swap';
  var WINDOWS = {
    contact: { url: '/contact', block: '.sqs-block-form', label: 'Contact' },
    news: { url: '/stay-tuned', block: '.sqs-block-newsletter, .newsletter-block', label: 'Stay tuned' }
  };
  var big = window.matchMedia('(min-width: 1100px) and (min-height: 600px)');
  var veil, showing = null;

  function build() {
    veil = document.createElement('div'); veil.className = 'rmi-veil';
    document.body.appendChild(veil);
    veil.addEventListener('click', close);                      // a click off the window closes it
    for (var name in WINDOWS) make(WINDOWS[name]);
    window.addEventListener('resize', function () { if (showing) place(showing); });
    // tell the instruments page this page can show its windows
    var page = document.querySelector('.rmi-frame');
    if (page) page.addEventListener('load', function () { page.contentWindow.postMessage({ rmiContactHost: true, rmiNewsHost: true }, PAGE); });
  }
  function make(w) {
    w.box = document.createElement('div'); w.box.className = 'rmi-window';
    w.box.setAttribute('role', 'dialog'); w.box.setAttribute('aria-label', w.label);
    w.frame = document.createElement('iframe'); w.frame.title = w.label;
    w.box.appendChild(w.frame); document.body.appendChild(w.box);
    w.form = null; w.wanted = false; w.where = { left: 16, top: 160 }; w.top = 160; w.hiding = 0;
    w.frame.addEventListener('load', function () { dress(w); });
  }
  function load(w) { if (!w.frame.getAttribute('src')) w.frame.src = w.url; }

  // the form's page, down to its form, dressed like the instruments page
  function dress(w) {
    var d = w.frame.contentDocument, tries = 0;
    (function wait() {
      var block = d && d.querySelector(w.block);
      if (!block || !block.querySelector('form')) { if (++tries < 100) setTimeout(wait, 100); return; }
      var font = d.createElement('link'); font.rel = 'stylesheet'; font.href = FONT; d.head.appendChild(font);
      var style = d.createElement('link'); style.rel = 'stylesheet'; style.href = STYLE;
      style.onload = style.onerror = function () {
        block.classList.add('rmi-form'); d.body.appendChild(block);
        w.form = block;
        new w.frame.contentWindow.ResizeObserver(function () { if (showing === w) place(w); else fit(w); }).observe(block);
        fit(w);
        if (w.wanted) { w.wanted = false; show(w); }
      };
      d.head.appendChild(style);
      d.addEventListener('keydown', function (e) { if (e.key === 'Escape') close(); });
    })();
  }
  function pad(w) { var cs = getComputedStyle(w.box); return parseFloat(cs.paddingTop) + parseFloat(cs.paddingBottom); }
  function fit(w) {
    if (!w.form) return;
    var room = window.innerHeight - (big.matches ? 48 : w.top + 16) - pad(w);
    w.frame.style.height = Math.max(120, Math.min(w.form.offsetHeight + 2, room)) + 'px';
  }
  function place(w) {
    if (big.matches) { w.box.style.left = w.box.style.top = ''; fit(w); return; }
    // a phone: under the link, or as much higher as it takes for the whole form to fit
    var need = (w.form ? w.form.offsetHeight + 2 : 300) + pad(w);
    w.top = Math.max(16, Math.min(w.where.top, window.innerHeight - 16 - need));
    w.box.style.left = w.where.left + 'px'; w.box.style.top = w.top + 'px';
    fit(w);
  }
  function show(w) {
    if (showing && showing !== w) hide(showing);
    clearTimeout(w.hiding);
    w.box.style.display = 'flex'; w.box.getBoundingClientRect();           // laid out first (so it fades in), then placed
    place(w); veil.classList.add('open'); showing = w;
    w.box.classList.add('open');
  }
  function hide(w) {
    w.box.classList.remove('open');
    w.hiding = setTimeout(function () { if (!w.box.classList.contains('open')) w.box.style.display = 'none'; }, 220);
  }
  function open(name, at) {
    var w = WINDOWS[name];
    if (at && typeof at === 'object') w.where = { left: at.left || 16, top: at.top || 160 };
    if (!w.form) { w.wanted = true; load(w); return; }
    show(w);
  }
  function close() {
    veil.classList.remove('open');
    for (var name in WINDOWS) if (WINDOWS[name].box.style.display === 'flex') hide(WINDOWS[name]);
    showing = null;
  }

  window.addEventListener('message', function (e) {
    if (e.origin !== PAGE || !e.data) return;
    if (e.data.rmiHello) e.source.postMessage({ rmiContactHost: true, rmiNewsHost: true }, PAGE);
    if (e.data.rmiContact) open('contact', e.data.rmiContact);
    if (e.data.rmiNews) open('news', e.data.rmiNews);
    if (e.data.rmiContactClose) close();
  });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') close(); });
  document.addEventListener('DOMContentLoaded', build);
  // on a computer, load the forms quietly once the page is up, so the windows open at once; a phone loads
  // each only when it is asked for (two whole pages loading behind it would slow its scrolling)
  window.addEventListener('load', function () {
    if (window.matchMedia('(hover: none)').matches) return;
    setTimeout(function () { load(WINDOWS.contact); }, 1500);
    setTimeout(function () { load(WINDOWS.news); }, 3000);
  });
})();
</script>
